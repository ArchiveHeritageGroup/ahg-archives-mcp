# mcp.theahg.co.za - GLAM MCP service (AI assistants read PSIS and propose for review).
# Two Docker services (~johanpiet/glam-mcp):
#   127.0.0.1:8031  signed-in service: /mcp plus the OAuth sign-in endpoints
#   127.0.0.1:8032  public read-only service: /public/mcp
# No bad-bot-guard here on purpose: assistant connectors call from their providers'
# servers with user agents we cannot list in advance. Reads without sign-in are
# public-tier only and writes need the user's own key, so the protection is a
# per-address rate limit instead.

limit_req_zone $binary_remote_addr zone=glam_mcp:10m rate=5r/s;

server {
    server_name mcp.theahg.co.za;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    # Signed-in MCP endpoint (OAuth token, or the user's catalogue key as bearer).
    location = /mcp {
        limit_req zone=glam_mcp burst=20 nodelay;
        proxy_pass http://127.0.0.1:8031;
        # Streamable HTTP answers can be server-sent event streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # OAuth: client registration, sign-in page, authorization, tokens, revocation.
    location ~ ^/(authorize|token|register|revoke|login)$ {
        limit_req zone=glam_mcp burst=10 nodelay;
        proxy_pass http://127.0.0.1:8031;
    }

    # OAuth discovery documents.
    location ^~ /.well-known/oauth- {
        proxy_pass http://127.0.0.1:8031;
    }

    # Public read-only MCP endpoint, no sign-in.
    location = /public/mcp {
        limit_req zone=glam_mcp burst=20 nodelay;
        proxy_pass http://127.0.0.1:8032;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Staff pages: usage figures (#10) and demo catalogues; each checks the catalogue key itself.
    location ~ ^/(usage|catalogues)$ {
        limit_req zone=glam_mcp burst=5 nodelay;
        proxy_pass http://127.0.0.1:8031;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8031;
    }

    location / {
        return 404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mcp.theahg.co.za/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mcp.theahg.co.za/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = mcp.theahg.co.za) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mcp.theahg.co.za;
    return 404; # managed by Certbot


}
