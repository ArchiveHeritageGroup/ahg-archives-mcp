# AHG Archives MCP for one hosted client (hosting/client.sh publish). Same routes as
# docs/nginx-mcp.theahg.co.za.conf; the glam_mcp rate-limit zone is defined there.
# certbot --nginx adds the certificate and the redirect from port 80.
server {
    server_name @HOST@;
    listen 80;
    listen [::]:80;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    location = /mcp {
        limit_req zone=glam_mcp burst=20 nodelay;
        proxy_pass http://127.0.0.1:@SIGNED@;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location ~ ^/(authorize|token|register|revoke|login)$ {
        limit_req zone=glam_mcp burst=10 nodelay;
        proxy_pass http://127.0.0.1:@SIGNED@;
    }
    location ^~ /.well-known/oauth- {
        proxy_pass http://127.0.0.1:@SIGNED@;
    }
    location = /public/mcp {
        limit_req zone=glam_mcp burst=20 nodelay;
        proxy_pass http://127.0.0.1:@PUBLIC@;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location ~ ^/(usage|catalogues)$ {
        limit_req zone=glam_mcp burst=5 nodelay;
        proxy_pass http://127.0.0.1:@SIGNED@;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:@SIGNED@;
    }
    location / {
        return 404;
    }
}
