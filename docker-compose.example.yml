# Example only. Copy to docker-compose.yml (git-ignored) and replace every
# example.org address with your own. Secrets go in .env, which must never be
# committed: CATALOGUE_API_KEY (a read-only service user's key) and MCP_SECRET
# (a Fernet key; generate with:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())").
#
# Two services from one image:
#   mcp-public  read-only, no sign-in     -> https://mcp.example.org/public/mcp
#   mcp         OAuth sign-in or staff key -> https://mcp.example.org/mcp
x-common: &common
  # Ready-made: ghcr.io/archiveheritagegroup/ahg-archives-mcp:0.5.0 (pin a version), or build your own:
  build: .
  image: ahg/glam-mcp:phase2
  restart: unless-stopped
  user: "1000:1000"   # the host account that owns ./logs and ./data
  volumes:
    - ./logs:/logs
    - ./data:/data

x-catalogue: &catalogue
  GLAM_BACKEND: auto                              # auto (asks the catalogue), atom-ahg or atom-base
  CATALOGUE_URL: https://catalogue.example.org    # your catalogue's public address
  CATALOGUE_NAME: "Example Archive catalogue"     # how answers name the catalogue
  CATALOGUE_API_KEY: ${CATALOGUE_API_KEY}

services:
  mcp-public:
    <<: *common
    ports:
      - "127.0.0.1:8032:8000"
    environment:
      <<: *catalogue
      GLAM_AUTH: "off"
      GLAM_HTTP_PATH: /public/mcp
      GLAM_CALL_LOG: /logs/calls-public.jsonl
      GLAM_DATA: /data
      MCP_SIGNED_IN_URL: https://mcp.example.org/mcp

  mcp:
    <<: *common
    ports:
      - "127.0.0.1:8031:8000"
    environment:
      <<: *catalogue
      GLAM_AUTH: oauth
      GLAM_HTTP_PATH: /mcp
      GLAM_CALL_LOG: /logs/calls.jsonl
      GLAM_USAGE_LOGS: /logs/calls.jsonl,/logs/calls-public.jsonl   # staff page /usage
      GLAM_DATA: /data
      MCP_PUBLIC_URL: https://mcp.example.org
      GLAM_SECRET: ${MCP_SECRET}
